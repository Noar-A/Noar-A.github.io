    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding: 45px;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.day-mode {
            background-color: #DCDBD1;
            color: #393831;
        }

        body.night-mode {
            background-color: #000000;
            color: #FFA500;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .theme-toggle:hover {
            opacity: 0.7;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            border: 1px solid currentColor;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.85;
        }

        .card:hover {
            opacity: 1;
            transform: translateX(5px);
        }

        .card-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-excerpt {
            line-height: 1.8;
            opacity: 0.8;
        }

        .card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            line-height: 1.8;
            text-align: justify;
            margin-top: 0;
        }

        .card.expanded .card-content {
            max-height: 5000px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid currentColor;
        }

        .card.expanded .card-excerpt {
            display: none;
        }

        .card-content p {
            margin-bottom: 20px;
        }

        .social-icons {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
        }

        .social-icons a {
            color: inherit;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 24px;
        }

        .social-icons a:hover {
            opacity: 1;
        }

        .social-icons svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 25px;
                padding-bottom: 100px;
            }

            header h1 {
                font-size: 2em;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
                padding: 8px 15px;
            }
        }
    </style>

    <script>
        // Theme management
        function toggleTheme() {
            const body = document.body;
            const themeText = document.querySelector('.theme-text');
            
            if (body.classList.contains('night-mode')) {
                body.classList.remove('night-mode');
                body.classList.add('day-mode');
                themeText.textContent = 'Night Mode';
                localStorage.setItem('theme', 'day');
            } else {
                body.classList.remove('day-mode');
                body.classList.add('night-mode');
                themeText.textContent = 'Day Mode';
                localStorage.setItem('theme', 'night');
            }
        }

        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'night';
            const body = document.body;
            const themeText = document.querySelector('.theme-text');
            
            if (savedTheme === 'day') {
                body.classList.remove('night-mode');
                body.classList.add('day-mode');
                themeText.textContent = 'Night Mode';
            } else {
                body.classList.remove('day-mode');
                body.classList.add('night-mode');
                themeText.textContent = 'Day Mode';
            }
        }

        // Card management
        function createExcerpt(text, wordLimit = 20) {
            const words = text.split(' ');
            if (words.length <= wordLimit) return text;
            return words.slice(0, wordLimit).join(' ') + '...';
        }

    "title": "FICUS ROBUSTA 03",
    "content": "For the first eight years, the rubber plant in my apartment corner did nothing worth mentioning. No new leaves. Not a millimeter taller. It just sat there, collecting dust, unmoved by the seasons. Then, out of nowhere, it began to grow. Three new shoots in a week. A fourth appeared by Sunday, unfurling itself in a tight green fist before opening, glossy and strange, against the window's sunlight. The color was something like boiled spinach. The leaves trembled a little, yet always held steady.\n\nI bought the plant the week I moved in, just after signing the lease. Garden shop near the train station, maybe a ten-minute walk. The pot was thin, cheap plastic, the leaves coated with a soft gray film. The woman at the register wrapped the pot's base in old newspaper, taping it shut with two pieces of clear tape. The whole thing stood no higher than my knee. There was a label along one side. FICUS ROBUSTA 02. Water once per week. Maybe I wasn't cut out for living things. I'd killed twenty-two goldfish over the years. Two cacti shriveled and died. I must have been their last stop.\n\nThis rubber plant outlasted everything. It survived the times I forgot to water it, survived being left on the balcony in midwinter, survived poor light and bugs. Sometimes I really thought about just throwing it away. I'd simply move the pot from window to window, careful to avoid direct heat or any kind of draft. That was all. And now, years late, it was finally responding.\n\nMost mornings, I made instant coffee and kept an eye on the plant. The apartment was quiet. The only sound was the pulse of the electric wall clock, a cheap thing, promotional, from a regional insurance agency. The second hand always stuttered at the six, like it was thinking things over before moving on. The stems had been braided at the shop, for visual effect, I guess. Now they were thicker than my thumb, bulging against each other, the twist looking almost muscular. The leaves from old times, the ones that had survived my neglect, all looked faded and rough, pocked with brown and curled at the edge. The new leaves put the old ones to shame. I considered cutting the old ones away and decided against it.\n\nThe plant had, by now, become the line between my kitchen and the sleeping area. I came home from work, set my keys down, and notice it. Usually nothing changed. Then, one Thursday night, I heard a wet little popping sound and saw a pale shoot uncurl, glossy and trembling in the orange light. The whole process took less than a second, like something trying to catch me looking. I wanted to record the next one on my phone, maybe catch the exact moment. Every time I sat and waited, nothing happened. I set up the phone, boiled water for noodles, and when I came back there was a fifth shoot, perfect, as if it had been there all along.\n\nThis was in June. The rainy season started. At night I listened to water rushing down the gutter outside. Sometime in those weeks I developed an allergy that made my nose itch and raised a rash on my upper arms. Most days I was at the warehouse near National Highway 246. My work was simple. Move boxes onto the conveyor, scan the code, stack rejects on the blue dolly. Occasionally a box would come apart, and noodles would spill onto the floor. Rarely something chemical would leak from a damaged box. We dealt with these things, as we dealt with everything, without incident. We kept to ourselves. The warehouse discouraged talk of life outside the building's walls. A nod as we entered the warehouse, and another when our work was done, was all we needed. Walking home, the city appeared to be a place filled with life kept almost hidden in apartments, building after building stacked atop one another. Spider plants growing wildly, yogurt fermenting in an old margarine tub, fish reduced to bones and murky water. Whole ecosystems, secret to us, were parked all around the city.\n\nMy own life was the sum of small orderly patterns. Shower. Towel off and observe the rash. Used tissues in a supermarket bag. Observe the plant for no special reason. And the plant persisted. New leaves, stretching wider than my palm, sprouted every few days. The stems were swollen and pressed against the interior limits of the pot. On occasion, while changing clothes, the image of the plant watching me from behind a curtain of leaves popped into my head. Pure nonsense, even if the idea was an appealing one; there was no reason to mind it.\n\nThe odor in the apartment shifted. At first, just a whiff of dirt and sap. Later it developed an edge to it, like something was fermenting in the plant, which was when I passed by it. One night, after brushing my teeth, I noticed that a bead of sticky liquid had formed at the tip of a new shoot. So I touched it with my finger. The sap was a milky consistency. Warm, almost oily. I wiped it with toilet paper; the odor remained on my skin. Sometimes, lying in bed, I could hear a faint noise coming from the direction of the plant. I couldn't tell what it was. It could have been the building. It could have been the cars going by outside. It was always the same kind of damp creaking sound, hesitant, alive, like a slow clock working its way through a difficult moment.\n\nSome people talk about a pattern of hearing voices in the rain; others suggest their cat sees ghosts in the shadows. I didn't buy into any of that. I generally confined myself to what I could see and touch, which never amounted to much. When I was a kid in high school, I tried drugs and sex and some harmless, basic occult practices; none of it had done much for me. So really, the only unusual thing in my life was the rubber plant. The rubber plant, and the rash.\n\nAfter the second week, the stems lost their neat pattern. The braid that once looked decorative now looked torn apart, like muscle pulled at the seam. The roots pressed up against the thin wall of the pot, and at night, I sometimes heard a slow, quiet cracking from that corner. I slept badly. The rash moved up to my neck and jaw. On the third Sunday, I woke up with a single green leaf on my pillow. I had no memory of moving it there. The leaf was flawless, shining, almost slick. It left a pale green stain on my sheet. I made instant coffee as usual. The plant pointed its top shoot in my direction, almost like it was looking back. It felt curious more than threatening.\n\nMonday, I stayed home from work. Called in sick, said nothing else. Lay on the bed most of the day, listening to the rain and the sound of tires on wet pavement. The rash itched like mad; I didn't scratch. In the afternoon I picked the fallen leaf from the pillow and laid it on the kitchen counter. From there I could watch it while I ate. It radiated a smell. Sweet, damp, just shy of rotting. Tuesday. Another leaf, this time on the bathroom sink. I checked the rim for dust and hair. The leaf was the same size, the same green. I placed it next to the first. By the end of the week, there were five of them, all fresh, all identical, glossy, unblemished, lined up side by side like a fan. No bug bites. No brown marks. I stopped wondering what the plant was up to. I just accepted the leaves, part of the routine now. Maybe they were an offering. Maybe a message.\n\nI still went out for groceries. Rice, instant curry, frozen vegetables. Occasionally canned eel, sometimes dried sausage. I used the small gas burner. I washed my hands obsessively; the rash did not fade. One evening while eating white rice and pickled seaweed, I looked over and saw the pot about to burst open. The stems were pushing hard enough to start a warp in the rim. The sound of splitting was unmistakable this time. Conspicuous and wet, like fruit splitting open. I sat there with the bowl in my hand and looked. A pink nodule had made itself known at the base of the plant, between the leaves. Just a little tip peeking out, shiny and unusually bright.\n\nI waited. Nothing happened. I woke up at midnight to dragging sounds. The pot had cracked, and dirt spilled onto the floor. I tiptoed across the room, careful not to step in the dirt. The nodule had grown overnight, no bigger than my thumb, protruding between the stems. I did a quick (and morbid) search online for pictures of rubber plants. No picture showed a nodule as bright as mine, or quite this shape. Too pink, too shiny. In the bathroom, I examined the rash. Each oval mark was rimmed in green with pink, shiny centers. Exactly the same color as the nodule at the base of my plant. I tried not to think about it. After finishing my shift on Thursday, I headed back down to the same garden center and purchased a larger pot and a bag of soil. The woman at the register gave no sign of knowing me, as she was preoccupied reading a paperback and softly humming. I paid with cash and left. When I took the plant out of the first pot to repot it, the roots came out as one knot, curled and tangled. Some of the roots were pink, instead of white and after untangling, it started to ooze a milky sap. I scrubbed my hands, first with soap, then with alcohol wipes, for a long time; the smell remained. The nodule was now twice the size of my thumb and only pulsed lightly. By morning, a ring of liquid formed around it. The rash on my neck had spread on to my jaw and into my cheeks. I didn't look into a mirror. On the stairs, when I encountered neighbors, I kept my face down.\n\nBy Friday, the kitchen counter had seven leaves. The two new leaves were growing next to the original five. I still didn't know what to do with them. None of them wilted. I thought about chopping one up and putting it in my noodles; halfway through the thought, my hand froze.\n\nIt was Saturday night, there were sounds again, soft, purposeful sounds, not the familiar creaks. The nodule had begun to split, the pink skin opening at the tip. My mouth tasted of metal. I sat at the table, listening for more. By morning, the nodule had split open, revealing something like a tongue, red and leaf-shaped, swinging back and forth in the still air. I didn't do anything. I didn't call anyone. I made coffee, in my usual cup, and sat in direct line with the plant. The new tongue-leaf vibrated while I watched. For the first time in weeks, my rash did not itch. Breakfast. Instant miso soup, rice, and three slices of pickled radish. I ate in silence. The plant did nothing. By midday, the nodule had shrunk and closed. Only the new leaf, a little red streaked, remained. I found myself more settled. My warmth left my skin. I wiped the counter in the kitchen and stacked the old leaves, neat and side by side, on a tray.\n\nSunday, nothing happened. I stayed in, fighting through a dog-earred manga I found, the plant did nothing. Monday morning, the leaf dropping started again. One, two, four leaves; fast and all seemed to drop directly at the foot of my bed. I picked them up and dumped them into my tray. The nodule dried, shriveled, fell off. When I picked it, the surface had turned stiff and rubbery, cold. I added it to the tray with everything else.\n\nBy the end of the month, the rash was gone. The rubber plant ceased its growth. Now, every few days, it would drop a pristine green leaf. I enjoyed consuming two with each meal. Thinly sliced, tossed with vinegar, or pressed onto rice. It tasted like dirt, a bit bitter, and not entirely bad. After this nothing. Life resumed. I worked, and ate. I even spent some amount of time marking the growth of the leaves on a calendar. The plant sat alone in its corner, just another thing amongst their cheap things. All that remained of the event were the green rings left in my kitchen tray. If I had become plant, or was still becoming it, there was nothing left to show for it. And without the walls of reciprocation, the city continued to move, sleepless and unconcerned with the previous lives.",
    "createdAt": "2025-10-18T01:16:21.049Z"
  },

    "title": "The Girl",
    "content": "During my college days, I rented a small, rectangular apartment that was above the remnants of a soba shop that hadn’t been open for two years. The sign for the restaurant hung above the entrance, the name removed by rain over the years, and no one ever went there. Never once, never ever. I would lie on my futon in the middle of the night, with my ear to the floor, and I would listen, waiting for any noise to come up from the soba shop below my apartment. There was never any noise.    \n\nThe room was very sparse. A scruffy wooden desk, with a pockmarked and stained top, a malformed and crooked two-burner stove against the wall, and a dented yellow refrigerator that hummed softly and melted into the utter cold of the dark room. The glass of the window rattled in the wind, and the oily undecided light seeped away slowly.\n\nThere was a girl living in the apartment down the hall. I first spoke to her in the hallway. She was full hands carrying a cardboard box with a rice cooker cradled inside the box. She had short hair, and was wearing a faded blue sweatshirt, and she had her hands on the edges of the box like they were looking for a way to get completely behind the box. Her eyes blinked away from me quickly. \n\n\"Are you moving in?\" I asked. \n\nShe nodded independently, like the question was unimportant discomfort. \"No, just making dinner.\" \n\nSometimes I wouldn’t sleep very well. I would get up and start watching out the back window of the soba shop overlooking with the washed orange color spilled out from the streetlight that buzzed every night. One late night in late October, I noticed her. She stood completely still, frozen in the radius of light just below the streetlamp. I watched her for a long time trying to decide if I wanted to walk down there and ask her what she was doing outside. Of course, in the end, I didn't. \n\nEven now, when I look back, I wonder why I never talked to the girl again. Maybe I simply thought it better that way or, maybe it was just that I had no idea how to approach her. These things happen; you miss the opportunity, and when you go to recreate it, it is lost and gone forever. \n\nWhat I remember most was the wind beating against the windowpanes, and the thin orange haze floating slowly in the parking lot no matter how many times the rain had come. And I still occasionally wonder if the girl with the blue hoodie remembers that soba shop. Maybe she forgot the whole thing. \n\nBut I couldn't forget. I remember it all. Like the smell of the hallway when it rained.",
    "createdAt": "2025-10-18T14:15:06.675Z"
  },

    "title": "My Coffee",
    "content": "I brush the coffee grounds out of the basket and rinse the filter under the kitchen tap. My hands move by themselves, almost as if I’ve detached from them, like they belong to someone else and I—the person in control, or at least the observer of this existence—am simply watching from a half step away. I suppose that is how I move through most mornings now. I watch myself, operating by habit, rewinding and replaying certain memories that, like the heavy curl of steam rising from a kettle, keep circling even when I’d rather they not.\n\nIt’s just before 6 a.m. The sky is still dark, but there’s a line of dim yellow just above the neighbor’s rooftop. The neighbor is an elderly widow named Nakao. I have never spoken more than a handful of words to her. Mostly “good morning,” sometimes “the azaleas look nice this year.” A while ago (maybe three years, maybe four) her husband died from a stroke in his sleep, and after that she’d sometimes stand by the fence in the afternoons as if waiting for something to happen. Sometimes she’d hum a little. Something almost like a children’s song.\n\nI pour water into the kettle and switch it on. As it starts to boil, I realize that I’ve put far too much in. More than I need for just one cup. I suppose I could make extra and pour the rest in a thermos, but that feels pointless. I rarely drink a second cup anymore. I pour the excess water down the sink. I watch it swirl.\n\nBy the time I finish making coffee and carrying it to the table, the world has gotten a little brighter. I sit, and I sip, and I look at the kitchen clock.\n\nSometimes I think the seconds move too quickly. Other times the clock seems to barely move at all. The second hand stutters, then jerks ahead, then pauses. Like it’s catching its own breath between each tick.\n\nWhen I was a child, I used to watch my father’s wristwatch and count aloud, hoping to catch the silver hands at the precise moment they overlapped. I’d never managed it. It was as if, on some atomic level, they actively avoided overlapping, for no other reason than to spite me.\n\nI try to remember the last time I spoke to my parents on the phone. Maybe it was last May. Or April. I recall my father asking if I’d been eating vegetables. Had I been exercising. I’d told him yes, I was going for long walks every morning, but that was a lie. Back then, I rarely left the apartment.\n\nIn the background I’d heard the television on at my parents’ house. The weather report. I distinctly remember hearing the words “unseasonably warm.” After I hung up, I thought the phrase over and over: unseasonably warm, unseasonably warm, like a little tongue twister with no purpose.\n\nI finish my coffee. There is sediment at the bottom of the cup, black and granular.\n\nI carry the cup to the sink and rinse it out carefully, making sure not one fleck of debris remains.\n\nThen I go back to the table. I sit and stare out the window at the neighbor’s azalea bushes, their leaves slick from the morning dew. I try to picture Nakao-san, the way she used to hum to herself. Sometimes, when I’m alone like this, I catch myself humming too, but I have no idea what tune it is.\n\nI check the clock. One minute and one second has passed.",

    "title": "Laundromat",
    "content": "A laundromat is located three blocks away from my apartment. It stays lit, even when the rest of the world lowers its light, a chalky square of artificial day, exhaling through the concrete. The machines are always there, they never leave. Yellow brand plates, their paint thin and abraded, edges gnawed down past the pallid underlayer, as if each cycle took another hole in their memory. When I couldn’t sleep on cold nights, I would go there even with the pile of clothes in the kitchen waiting for me unlidded, slouched down next to the trash, needing nothing from me. There was a mild comfort in it, the continual spin of the dryers, the vapor of the soap and burnt linen, the quiet red eye of the vending machine watching from the corner.\nThat winter I made it a habit, almost every week always after eleven when the fluorescents suffocated the tiled walls in blank white. There was only one other regular, a man with an old green backpack, set up by the dryers, hunching over a small portable TV resting between his knees. The picture jumped and failed, the volume was so low, silence would have been louder.\nOne night, I watched as the vending machine rejected him. He tried persuasion: a calm, calculated jiggle, never out of control, as if he thought he could reason with the springs and glass into just one more concession. The chips did not drop. He relented, letting the machine be. Outside, the orange point of a cigarette flared to life in the light. I stayed, listening, allowing the hum-thump rotations to fill the room.\n\nA week later, I brought an extra bag of chips and tossed it to him. He didn’t look, just took the bag and jammed it dry into his backpack like checking an inventory item off the list.\n\n“Thanks,” he said.\n\nThat was all we said. After that we just nodded. Two quiet actors referring to the situation mechanically like the machines with their droning. I keep coming back even when I have no laundry to wash. I think it is comforting to know I am not the only one caught in the light, or besides there was just something nice about revolving with no abandon around another stranger’s loss of sleep.\n\nEither way, now when I am sleeping there, it is back to those molded plastic benches, and I submit to the agreed upon pulsation of the machines, which will not change. The television is gone. The stranger is gone. The dryers still talk into the dark at the same time, like the way the surf might chew on the sand at the end of the night when an outsider has long since, it shows the same type of repetitiveness and inability to know who will stay in the heat of the circle.",
    "createdAt": "2025-10-18T14:24:03.218Z"
  }
]
            
            if (stories.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No stories yet. The archive awaits.</p></div>';

            container.innerHTML = stories.map((story, index) => `
                <div class="card" onclick="toggleCard(${index})">
                    <div class="card-title">${story.title}</div>
                    <div class="card-excerpt">${createExcerpt(story.content, 20)}</div>
                    <div class="card-content">
                        ${story.content.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleCard(index) {
            const cards = document.querySelectorAll('.card');
            cards[index].classList.toggle('expanded');
        }

        // Initialize
        loadTheme();
        renderCards();
    </script>
